<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allientic Vault Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background-color: #06080C; color: #DCE5F2; font-family: sans-serif; }
    .glass { background: rgba(10, 15, 24, 0.85); border: 1px solid rgba(0, 240, 255, 0.2); }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between overflow-hidden">
  <header class="p-4 glass flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></div>
      <h1 class="font-bold text-sm tracking-wider text-cyan-400 uppercase">ALLIENTIC VAULT</h1>
    </div>
    <div class="text-xs text-emerald-400 font-bold">ONLINE</div>
  </header>

  <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3"></main>

  <footer class="p-3 glass">
    <form id="chat-form" class="flex gap-2 max-w-2xl mx-auto">
      <input id="user-input" type="text" placeholder="Name" value="User" class="w-24 bg-gray-900 border border-gray-700 px-3 py-2 rounded text-xs text-white outline-none">
      <input id="msg-input" type="text" placeholder="Type message..." autocomplete="off" class="flex-1 bg-gray-900 border border-gray-700 px-4 py-2 rounded text-xs text-white outline-none">
      <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold px-4 py-2 rounded text-xs">SEND</button>
    </form>
  </footer>

  <script>
    const socket = io();
    const chatBox = document.getElementById('chat-box');
    const form = document.getElementById('chat-form');
    const msgInput = document.getElementById('msg-input');
    const userInput = document.getElementById('user-input');

    function renderMessage(data) {
      const isMe = data.sender === userInput.value.trim();
      const div = document.createElement('div');
      div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
      div.innerHTML = `
        <div class="max-w-[80%] rounded-lg p-3 text-xs ${isMe ? 'bg-cyan-950 border border-cyan-500 text-cyan-100' : 'bg-gray-900 border border-gray-800 text-gray-200'}">
          <div class="text-[10px] text-gray-400 mb-1 flex justify-between gap-4 font-bold">
            <span>${data.sender}</span><span>${data.time}</span>
          </div>
          <p>${data.text}</p>
        </div>
      `;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    socket.on('init_history', (history) => history.forEach(renderMessage));
    socket.on('new_message', (data) => renderMessage(data));

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      const sender = userInput.value.trim() || 'User';
      if (!text) return;
      socket.emit('send_message', { sender, text });
      msgInput.value = '';
    });
  </script>
</body>
</html>
